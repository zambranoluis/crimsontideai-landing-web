<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrimsonTide Orbit Mockup V6</title>
<style>
:root {
  --bg:#050b12;
  --panel:#08121d;
  --panel-2:#0b1724;
  --text:#f5f7fa;
  --red:#ea4650;
  --red-hot:#ff3040;
  --ring:rgba(234,70,80,.25);
  --ring-soft:rgba(234,70,80,.12);
  --border:rgba(255,255,255,.15);
  --radius:18px;
}

* { box-sizing:border-box; }

html, body {
  margin:0;
  min-height:100%;
}

body {
  min-height:100vh;
  display:grid;
  place-items:center;
  overflow:auto;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.mockup {
  position:relative;
  width:min(1080px, calc(100vw - 40px));
  aspect-ratio:1080 / 660;
  min-height:600px;
  isolation:isolate;
}

/* Square by construction: all rings remain true circles. */
.orbit-field {
  position:absolute;
  left:47%;
  top:50%;
  width:min(61%, 620px);
  aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  z-index:1;
  pointer-events:none;
}

.orbit-svg {
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}

.ring {
  fill:none;
  stroke:var(--ring);
  stroke-width:1.45;
}

.ring.soft {
  stroke:var(--ring-soft);
}

.ring.dotted {
  stroke:rgba(234,70,80,.18);
  stroke-width:2;
  stroke-linecap:round;
  stroke-dasharray:1 10;
}

/* The vector pieces are literally dashed portions of the same circles.
   This guarantees the lower segment can never invert away from its orbit. */
.vector-segment {
  fill:none;
  stroke:var(--red);
  stroke-linecap:round;
  filter:drop-shadow(0 0 5px rgba(234,70,80,.28));
  transform-origin:310px 310px;
}

.vector-segment.outer {
  stroke-width:5;
  stroke-dasharray:17 83;
  animation:dashOuter 12s linear infinite;
}

.vector-segment.mid {
  stroke-width:4;
  stroke-dasharray:14 86;
  animation:dashMid 16s linear infinite reverse;
}

.vector-segment.inner {
  stroke-width:3.4;
  stroke-dasharray:12 88;
  animation:dashInner 20s linear infinite;
}

@keyframes dashOuter {
  to { stroke-dashoffset:-100; }
}
@keyframes dashMid {
  to { stroke-dashoffset:-100; }
}
@keyframes dashInner {
  to { stroke-dashoffset:-100; }
}

.particle {
  fill:var(--red-hot);
  filter:
    drop-shadow(0 0 5px rgba(255,48,64,.95))
    drop-shadow(0 0 12px rgba(255,48,64,.52));
}

.hub {
  position:absolute;
  left:47%;
  top:50%;
  width:188px;
  aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  z-index:3;
  display:grid;
  place-items:center;
  border-radius:var(--radius);
  color:var(--red-hot);
  background:
    radial-gradient(circle at 50% 8%, rgba(234,70,80,.14), transparent 37%),
    linear-gradient(155deg,rgba(30,18,24,.98),rgba(7,13,20,.98));
  border:1px solid rgba(234,70,80,.16);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.02) inset,
    0 16px 38px rgba(0,0,0,.28),
    0 0 28px rgba(234,70,80,.10);
}

.chat-icon {
  width:74%;
  height:74%;
  filter:drop-shadow(0 0 7px rgba(255,48,64,.16));
}

.card {
  position:absolute;
  z-index:4;
  width:168px;
  min-height:142px;
  padding:16px 14px 14px;
  display:grid;
  place-items:center;
  align-content:center;
  gap:8px;
  text-align:center;
  border-radius:var(--radius);
  background:linear-gradient(180deg,rgba(11,23,35,.98),rgba(6,13,21,.98));
  border:1px solid var(--border);
  box-shadow:0 15px 34px rgba(0,0,0,.26);
}

.card.people { left:62.2%; top:12.2%; }
.card.shield { left:11.8%; top:52.8%; }
.card.rocket { left:63.1%; top:60.2%; }

.card-icon {
  width:52px;
  height:52px;
  color:var(--red-hot);
}

.card h3 {
  margin:0;
  color:var(--text);
  font-size:17px;
  line-height:1.06;
  letter-spacing:-.02em;
  font-weight:620;
}

.controls {
  position:absolute;
  right:0;
  bottom:-44px;
  z-index:7;
}

.controls button {
  min-height:40px;
  padding:0 14px;
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  background:rgba(7,15,24,.88);
  color:var(--text);
  font:inherit;
  font-size:13px;
  cursor:pointer;
}

.controls button:hover {
  border-color:rgba(234,70,80,.42);
}

.controls button:focus-visible {
  outline:2px solid var(--red);
  outline-offset:3px;
}

.mockup.paused .vector-segment {
  animation-play-state:paused;
}

@media (max-width:900px) {
  body {
    place-items:start center;
    padding:34px 0 52px;
  }

  .mockup {
    width:min(900px, calc(100vw - 24px));
    min-height:720px;
    aspect-ratio:auto;
  }

  .orbit-field {
    left:50%;
    top:43%;
    width:min(82vw,580px);
  }

  .hub {
    left:50%;
    top:43%;
    width:174px;
  }

  .card {
    width:156px;
    min-height:132px;
  }

  .card.people {
    left:auto;
    right:6%;
    top:9%;
  }

  .card.shield {
    left:4%;
    top:auto;
    bottom:9%;
  }

  .card.rocket {
    left:auto;
    right:6%;
    top:auto;
    bottom:2%;
  }
}

@media (max-width:620px) {
  body {
    padding:26px 0 48px;
  }

  .mockup {
    min-height:670px;
  }

  .orbit-field {
    top:42%;
    width:min(92vw,460px);
  }

  .hub {
    top:42%;
    width:154px;
    border-radius:16px;
  }

  .card {
    width:136px;
    min-height:116px;
    padding:12px 10px;
    border-radius:16px;
    gap:6px;
  }

  .card-icon {
    width:42px;
    height:42px;
  }

  .card h3 {
    font-size:14px;
  }

  .card.people {
    top:5%;
  }

  .card.shield {
    bottom:5%;
  }

  .card.rocket {
    bottom:0;
  }
}

@media (prefers-reduced-motion:reduce) {
  .vector-segment {
    animation-play-state:paused !important;
  }
}
</style>
</head>

        <path id="orbitMid" d="M310 91 A219 219 0 1 1 309.99 91"/>
        <path id="orbitInner" d="M310 139 A171 171 0 1 1 309.99 139"/>

      <!-- True concentric circles -->
      <circle class="ring dotted" cx="310" cy="310" r="292"/>
      <circle class="ring dotted" cx="310" cy="310" r="278" opacity=".52"/>
      <circle class="ring" cx="310" cy="310" r="265"/>
      <circle class="ring soft" cx="310" cy="310" r="219"/>
      <circle class="ring soft" cx="310" cy="310" r="171"/>

      <!-- Curved vector segments are portions of these exact same circles -->

      <circle class="vector-segment mid" cx="310" cy="310" r="219" pathLength="100"/>
      <circle class="vector-segment inner" cx="310" cy="310" r="171" pathLength="100"/>

      <!-- Particles stay attached to the same orbit paths -->
      <circle class="particle" r="7">
        <animateMotion dur="11s" repeatCount="indefinite">

      </circle>

      <circle class="particle" r="6">

      <circle class="particle" r="5">

    <button type="button" id="pauseBtn" aria-pressed="false">Pause animation</button>

<script>
(() => {
  const root = document.getElementById('mockup');
  const btn = document.getElementById('pauseBtn');
  const svg = root.querySelector('.orbit-svg');
  let paused = false;

  btn.addEventListener('click', () => {
    paused = !paused;
    root.classList.toggle('paused', paused);

    if (paused && typeof svg.pauseAnimations === 'function') svg.pauseAnimations();
    if (!paused && typeof svg.unpauseAnimations === 'function') svg.unpauseAnimations();

    btn.textContent = paused ? 'Resume animation' : 'Pause animation';
    btn.setAttribute('aria-pressed', String(paused));
  });
})();
</script>
