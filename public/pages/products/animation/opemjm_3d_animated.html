<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrimsonTide UI Mockup — Opción B · Original Particles</title>
<style>


:root {
  --bg: #050809;
  --radius: 18px;
  --perspective: 1600px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: #040708;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.scene {
  position: relative;
  width: min(94vw, 1380px);
  padding: 7vh 0;
  perspective: var(--perspective);
  perspective-origin: 50% 48%;
}
.card-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1910 / 932;
  transform-style: preserve-3d;
  will-change: transform;
}
.depth {
  position: absolute;
  inset: 12px -13px -17px 12px;
  border-radius: calc(var(--radius) + 2px);
  background: linear-gradient(145deg, #152025, #05080a 70%);
  border: 1px solid rgba(255,255,255,.035);
  transform: translateZ(-34px);
  box-shadow: 0 34px 88px rgba(0,0,0,.52);
}
.floor-shadow {
  position: absolute;
  left: 8%;
  right: 2%;
  bottom: -10%;
  height: 22%;
  border-radius: 50%;
  background: rgba(0,0,0,.5);
  filter: blur(38px);
  transform: translateZ(-76px) rotateX(78deg);
  pointer-events: none;
}
.card {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: var(--radius);
  background: #090c0d;
  border: 1px solid rgba(255,255,255,.08);
  box-shadow:
    0 48px 98px rgba(0,0,0,.58),
    0 18px 38px rgba(0,0,0,.34);
  transform-style: preserve-3d;
  backface-visibility: hidden;
}
.ui-shot {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  user-select: none;
  -webkit-user-drag: none;
}
.overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
}
.glass {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background:
    linear-gradient(116deg,
      rgba(255,255,255,.085) 0%,
      rgba(255,255,255,.018) 13%,
      transparent 29%,
      transparent 76%,
      rgba(255,255,255,.012) 100%);
  mix-blend-mode: screen;
  opacity: .28;
}
.edge {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    inset 0 -1px 0 rgba(255,255,255,.035);
}
.badge {
  position: fixed;
  left: 18px;
  bottom: 16px;
  padding: 7px 10px;
  border-radius: 999px;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: rgba(255,255,255,.46);
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(255,255,255,.06);
  backdrop-filter: blur(10px);
}
@media (max-width: 760px) {
  .scene { width: 96vw; padding: 3vh 0; }
  :root { --radius: 12px; }
}
@media (max-height: 650px) {
  .scene { width: min(90vw, 1200px); padding: 3vh 0; }
}
@media (prefers-reduced-motion: reduce) {
  .card-wrap { transform: rotateX(3.5deg) rotateY(-6deg) !important; }
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
  }
}


body {
  background:
    radial-gradient(circle at 50% 38%, rgba(0,114,101,.17), transparent 31%),
    radial-gradient(circle at 74% 63%, rgba(17,79,67,.11), transparent 28%),
    linear-gradient(180deg,#050808 0%,#020405 100%);
}
.card {
  box-shadow:
    0 52px 110px rgba(0,0,0,.64),
    0 18px 42px rgba(0,0,0,.36),
    0 0 78px rgba(0,231,197,.075);
}
.overlay {
  background:
    linear-gradient(120deg, rgba(255,255,255,.018), transparent 24%, transparent 72%, rgba(0,255,211,.012));
}
.overlay::before {
  content:"";
  position:absolute;
  left:47.5%;
  top:6.4%;
  width:10.4%;
  aspect-ratio:1;
  border-radius:50%;
  background:
    radial-gradient(circle, rgba(0,255,215,.18), rgba(0,233,197,.045) 36%, transparent 69%);
  filter:blur(7px);
  animation:breathB 3.6s ease-in-out infinite;
}
.overlay::after {
  content:"";
  position:absolute;
  left:25.6%;
  top:50%;
  width:52.6%;
  height:8.2%;
  border-radius:999px;
  background:linear-gradient(90deg, transparent, rgba(93,255,223,.022), transparent);
  box-shadow:
    0 0 0 1px rgba(110,255,226,.03),
    0 0 28px rgba(0,239,201,.07),
    inset 0 0 18px rgba(71,245,215,.018);
  animation:inputB 3.4s ease-in-out infinite;
}
@keyframes breathB {
  0%,100% { transform:translateY(0) scale(.94); opacity:.48; }
  50% { transform:translateY(-3px) scale(1.1); opacity:1; }
}
@keyframes inputB {
  0%,100% { opacity:.24; filter:brightness(.9); }
  50% { opacity:.72; filter:brightness(1.12); }
}
.particle {
  position:absolute;
  border-radius:50%;
  background:#21e2c0;
  box-shadow:0 0 8px rgba(33,226,192,.7);
  opacity:.4;
  animation:floatB var(--dur) ease-in-out infinite;
  animation-delay:var(--delay);
}
@keyframes floatB {
  0%,100% { transform:translate3d(0,0,0) scale(.75); opacity:.2; }
  50% { transform:translate3d(var(--dx),var(--dy),0) scale(1.2); opacity:.75; }
}
.sidebar-glow {
  position:absolute;
  left:.1%;
  top:0;
  width:4.1%;
  height:100%;
  background:linear-gradient(180deg, transparent 22%, rgba(56,224,188,.025) 42%, rgba(56,224,188,.055) 58%, transparent 80%);
  filter:blur(2px);
  animation:sideB 4.8s ease-in-out infinite;
}
@keyframes sideB {
  0%,100% { opacity:.22; }
  50% { opacity:.75; }
}
.shimmer {
  position:absolute;
  left:25.7%;
  top:50.4%;
  width:52.3%;
  height:7.2%;
  overflow:hidden;
  border-radius:999px;
}
.shimmer::after {
  content:"";
  position:absolute;
  top:-20%;
  left:-18%;
  width:16%;
  height:140%;
  background:linear-gradient(90deg, transparent, rgba(129,255,231,.11), transparent);
  transform:skewX(-18deg);
  animation:shimmerB 5.5s ease-in-out infinite;
}
@keyframes shimmerB {
  0%,16% { left:-20%; opacity:0; }
  35% { opacity:1; }
  64% { left:108%; opacity:.72; }
  70%,100% { left:108%; opacity:0; }
}


/* ================================================================
   ORIGINAL PARTICLE SYSTEM
   Static cloud removed from screenshot; real canvas effect replaces it.
   ================================================================ */
.overlay::before { display: none !important; }
.particle { display: none !important; }

#particleCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 2;
}

.overlay { z-index: 3; }
.glass { z-index: 4; }
.edge { z-index: 5; }

</style>
</head>

<script>

(() => {
  const scene = document.getElementById('scene');
  const card = document.getElementById('cardWrap');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let hovering = false;
  let targetX = 3.8, targetY = -7.0;
  let currentX = targetX, currentY = targetY;
  const startedAt = performance.now();

  scene.addEventListener('pointerenter', () => hovering = true);
  scene.addEventListener('pointermove', (e) => {
    hovering = true;
    const r = scene.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width;
    const py = (e.clientY - r.top) / r.height;
    targetY = (px - .5) * 19;
    targetX = (.5 - py) * 12;
  });
  scene.addEventListener('pointerleave', () => hovering = false);

  function animate(now) {
    if (!reduceMotion) {
      if (!hovering) {
        const t = (now - startedAt) / 1000;
        targetX = 3.7 + Math.sin(t * .45) * .75;
        targetY = -7.0 + Math.sin(t * .34) * 1.25;
      }

            return {
                origX: x + Math.sin(phase) * wobble,
                origY: y + Math.cos(phase * 0.9) * wobble,
                origZ: z + Math.sin(phase * 1.15) * wobble,
                theta: seededNoise(index, 7) * Math.PI * 2 + Math.sin(phase) * settings.chaos,
                phiZ: seededNoise(index, 8) * Math.PI * 2 + Math.cos(phase) * settings.chaos
            };
        }

        function blendParticlePoint(fromPoint, toPoint, amount) {
            return {
                origX: lerp(fromPoint.origX, toPoint.origX, amount),
                origY: lerp(fromPoint.origY, toPoint.origY, amount),
                origZ: lerp(fromPoint.origZ, toPoint.origZ, amount),
                theta: lerp(fromPoint.theta, toPoint.theta, amount),
                phiZ: lerp(fromPoint.phiZ, toPoint.phiZ, amount)
            };
        }

        function renderSolidShape(shape, rotX, rotY, sphereSize, rgb1, rgb2) {
            const mesh = createSolidMesh(shape);
            const screenOffsetX = 0;
            const screenOffsetY = 0;
            const moveZScale = getMoveZScale(params.moveZ);
            const transformed = mesh.vertices.map(v => {
                const r3d = Math.sqrt(v.x*v.x + v.y*v.y + v.z*v.z) || 1;
                const theta = Math.atan2(v.z, v.x);
                const phiZ = Math.acos(v.y / r3d);
                const morph = Math.sin(theta * 4 + time * 2) * Math.cos(phiZ * 3 - time) * params.morph;
                const radius = 1 + morph;
                let x = v.x * radius;
                let y = v.y * radius;
                let z = v.z * radius;
                let y1 = y * Math.cos(rotX) - z * Math.sin(rotX);
                let z1 = y * Math.sin(rotX) + z * Math.cos(rotX);
                y = y1;
                z = z1;
                let x1 = x * Math.cos(rotY) - z * Math.sin(rotY);
                let z2 = x * Math.sin(rotY) + z * Math.cos(rotY);
                x = x1;
                z = z2;
                const scale = 3 / (3 + z);
                return {
                    x, y, z, sourceY: v.y,
                    px: PARTICLE_ANCHOR_X + (x * scale * sphereSize * moveZScale),
                    py: PARTICLE_ANCHOR_Y + (y * scale * sphereSize * moveZScale)
                };
            });
            const light = { x: -0.35, y: -0.55, z: -1 };
            const lightLength = Math.sqrt(light.x * light.x + light.y * light.y + light.z * light.z);
            light.x /= lightLength; light.y /= lightLength; light.z /= lightLength;

            const faces = mesh.faces.map(face => {
                let avgZ = 0;
                let avgY = 0;
                face.forEach(index => {
                    avgZ += transformed[index].z;
                    avgY += transformed[index].sourceY;
                });
                avgZ /= face.length;
                avgY /= face.length;
                return { face, avgZ, avgY };
            }).sort((a, b) => b.avgZ - a.avgZ);
            faces.forEach(item => {
                const a = transformed[item.face[0]];
                const b = transformed[item.face[1]];
                const c = transformed[item.face[2]];
                const ux = b.x - a.x, uy = b.y - a.y, uz = b.z - a.z;
                const vx = c.x - a.x, vy = c.y - a.y, vz = c.z - a.z;
                let nx = uy * vz - uz * vy;
                let ny = uz * vx - ux * vz;
                let nz = ux * vy - uy * vx;
                const normalLength = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
                nx /= normalLength; ny /= normalLength; nz /= normalLength;
                const lightAmount = Math.abs(nx * light.x + ny * light.y + nz * light.z);
                const nearBoost = Math.max(0, 1 - ((item.avgZ + 1.5) / 3)) * 0.16;
                const specular = Math.pow(Math.max(0, Math.abs(nz)), 14) * 0.16;
                const shade = Math.max(0.22, Math.min(1.08, 0.34 + lightAmount * 0.52 + nearBoost + specular));
                const gradientFactor = (item.avgY * -1 + 1) / 2;
                const baseColor = mixRgb(rgb1, rgb2, gradientFactor);
                const shadedColor = shadeRgb(baseColor, shade);
                ctx.beginPath();
                item.face.forEach((index, faceIndex) => {
                    const point = transformed[index];
                    if (faceIndex === 0) ctx.moveTo(point.px, point.py);
                    else ctx.lineTo(point.px, point.py);
                });
                ctx.closePath();
                ctx.fillStyle = "rgba(" + shadedColor.r + ", " + shadedColor.g + ", " + shadedColor.b + ", " + params.figureOpacity + ")";
                ctx.fill();
            });
        }
        
        function getStateDuration(state) {
            return Math.max(0.01, Number(state.duration) || 0.01) * Math.max(0.2, transitionDuration || 5);
        }

        function resolveTransitionPair() {
            if (!transitionEnabled) return null;
            if (transitionStates.length >= 2) {
                const durations = transitionStates.map(getStateDuration);
                const total = Math.max(0.2, transitionDuration || 5);
                if (total <= 0) return null;
                transitionTimeCounter += 1 / 60;
                if (!transitionLoopEnabled && transitionTimeCounter >= total) {
                    transitionTimeCounter = total;
                }
                let localTime = transitionLoopEnabled ? ((transitionTimeCounter % total) + total) % total : Math.min(transitionTimeCounter, total);
                let acc = 0;
                for (let i = 0; i < transitionStates.length; i++) {
                    const segmentDuration = durations[i];
                    if (localTime <= acc + segmentDuration) {
                        const fromIndex = i;
                        if (!transitionLoopEnabled && fromIndex === transitionStates.length - 1) {
                            const lastState = transitionStates[fromIndex];
                            if (lastState) applyStateToParams(lastState.data);
                            return null;
                        }
                        const toIndex = transitionLoopEnabled ? (i + 1) % transitionStates.length : Math.min(i + 1, transitionStates.length - 1);
                        const raw = (localTime - acc) / segmentDuration;
                        const eased = applyTransitionEasing(raw, transitionStates[fromIndex]?.transitionEase || 'smooth');
                        return { from: transitionStates[fromIndex], to: transitionStates[toIndex], t: eased };
                    }
                    acc += segmentDuration;
                }
            }
            if (state1 && state2) {
                const total = transitionDuration * 2;
                transitionTimeCounter += 1 / 60;
                if (!transitionLoopEnabled && transitionTimeCounter >= total) {
                    transitionTimeCounter = total;
                }
                const phase = transitionLoopEnabled ? (transitionTimeCounter % total) / total : Math.min(transitionTimeCounter, total) / total;
                const eased = applyTransitionEasing(phase, transitionStates[transitionStates.length - 1]?.transitionEase || 'smooth');
                return {
                    from: { id: -1, data: state1 },
                    to: { id: -2, data: state2 },
                    t: eased
                };
            }
            return null;
        }

        canvas.addEventListener('click', () => { 
            if(isPulseGlobalEnabled) pulseIntensity = params.pulseForce; 
        });

        function animate() {
            let t = 0;
            let activeMaxPoints = pointsArray.length;
            let dataArray1 = pointsArray;
            let dataArray2 = pointsArray;
            let transitionFromShape = params.shape;
            let transitionToShape = params.shape;
            const transitionPair = resolveTransitionPair();

            if (transitionPair) {
                const fromData = transitionPair.from.data;
                const toData = transitionPair.to.data;
                t = transitionPair.t;

                const segmentEffect = getTransitionEffectForState(transitionPair.from);
                const segmentCloudSettings = getTransitionCloudSettingsForState(transitionPair.from);
                const usesCloudDistortion = segmentEffect === 'particle-cloud' || segmentEffect === 'helix' || segmentEffect === 'double-helix';
                const baseMaxPoints = Math.max(fromData.points, toData.points);
                activeMaxPoints = usesCloudDistortion ? Math.max(1, Math.floor(baseMaxPoints * segmentCloudSettings.pointAmount)) : baseMaxPoints;
                const keyA = transitionPair.from.id + '-' + fromData.shape + '-' + activeMaxPoints;
                const keyB = transitionPair.to.id + '-' + toData.shape + '-' + activeMaxPoints;
                if (!transitionArrayCache.has(keyA)) transitionArrayCache.set(keyA, generateShapeArray(fromData.shape, activeMaxPoints));
                if (!transitionArrayCache.has(keyB)) transitionArrayCache.set(keyB, generateShapeArray(toData.shape, activeMaxPoints));
                dataArray1 = transitionArrayCache.get(keyA);
                dataArray2 = transitionArrayCache.get(keyB);

                params.size = lerp(fromData.size, toData.size, t);
                params.sphereRadius = lerp(fromData.sphereRadius, toData.sphereRadius, t);
                params.trail = lerp(fromData.trail, toData.trail, t);
                params.moveX = lerp(fromData.moveX || 0, toData.moveX || 0, t);
                params.moveY = lerp(fromData.moveY || 0, toData.moveY || 0, t);
                params.moveZ = lerp(fromData.moveZ || 0, toData.moveZ || 0, t);
                params.speed = lerp(fromData.speed, toData.speed, t);
                params.morph = lerp(fromData.morph, toData.morph, t);
                params.rotX = lerp(fromData.rotX, toData.rotX, t);
                params.rotY = lerp(fromData.rotY, toData.rotY, t);
                params.pulseForce = lerp(fromData.pulseForce, toData.pulseForce, t);
                params.pulseDecay = lerp(fromData.pulseDecay, toData.pulseDecay, t);
                params.sizeImpact = lerp(fromData.sizeImpact, toData.sizeImpact, t);
                params.speedImpact = lerp(fromData.speedImpact, toData.speedImpact, t);
                params.color1 = lerpColor(fromData.color1, toData.color1, t);
                params.color2 = lerpColor(fromData.color2, toData.color2, t);
                params.backgroundColor = lerpColor(fromData.backgroundColor || '#000000', toData.backgroundColor || '#000000', t);
                params.solidMesh = t < 0.5 ? !!fromData.solidMesh : !!toData.solidMesh;
                params.figureOpacity = lerp(fromData.figureOpacity ?? 1, toData.figureOpacity ?? 1, t);
                transitionFromShape = fromData.shape;
                transitionToShape = toData.shape;
            }

            ctx.clearRect(0, 0, width, height);
            
            pulseIntensity *= params.pulseDecay;
            let currentSpeed = params.speed + (pulseIntensity * params.speedImpact);
            let currentSize = params.size + (pulseIntensity * params.sizeImpact);
            time += currentSpeed;
            
            const rotX = time * params.rotX, rotY = time * params.rotY;
            const sphereSize = PARTICLE_SPHERE_SIZE;
            const screenOffsetX = 0;
            const screenOffsetY = 0;
            const moveZScale = getMoveZScale(params.moveZ);
            const rgb1 = hexToRgb(params.color1), rgb2 = hexToRgb(params.color2);
            const transitionEffect = transitionPair ? getTransitionEffectForState(transitionPair.from) : 'direct';
            const cloudSettings = transitionPair ? getTransitionCloudSettingsForState(transitionPair.from) : { spread: 2.2, chaos: 0.8, pointSize: 0.75 };
            const helixSettings = transitionPair ? getTransitionHelixSettingsForState(transitionPair.from) : { direction: 'forward', angle: 0, axisX: 0, axisY: 1, axisZ: 0, autoOrbit: false, tunnel: 0, thickness: 1, loops: 4.3, cloud: false, cloudIntensity: 0.8, drawDirection: 'forward' };
            const usesCloudDistortion = transitionEffect === 'particle-cloud' || transitionEffect === 'helix' || transitionEffect === 'double-helix';
            const cloudAmount = usesCloudDistortion ? getParticleCloudAmount(t) : 0;
            const helixOrderAmount = transitionEffect === 'helix' || transitionEffect === 'double-helix' ? cloudAmount : 0;
            const lockHelixOrbit = (transitionEffect === 'helix' || transitionEffect === 'double-helix') && !helixSettings.autoOrbit;
            const renderRotX = lockHelixOrbit ? 0 : rotX;
            const renderRotY = lockHelixOrbit ? 0 : rotY;

            if (params.solidMesh && cloudAmount <= 0.001) {
                const solidShape = transitionPair ? (t < 0.5 ? transitionFromShape : transitionToShape) : params.shape;
                renderSolidShape(solidShape, rotX, rotY, sphereSize, rgb1, rgb2);
                requestAnimationFrame(animate);
                return;
            }

            for (let i = 0; i < activeMaxPoints; i++) {
                let pBase = {};
                if (transitionPair) {
                    if (transitionEffect === 'particle-cloud') {
                        const cloudPoint = getParticleCloudPoint(i, cloudSettings, time);
                        const cloudPhase = t < 0.5 ? t * 2 : (t - 0.5) * 2;
                        pBase = t < 0.5 ? blendParticlePoint(dataArray1[i], cloudPoint, cloudPhase) : blendParticlePoint(cloudPoint, dataArray2[i], cloudPhase);
                    } else if (transitionEffect === 'helix' || transitionEffect === 'double-helix') {
                        const traversalDelay = (i / Math.max(1, activeMaxPoints - 1)) * 0.28;
                        const traversalProgress = t >= traversalDelay + 0.72 ? 1 : clamp((t - traversalDelay) / 0.72, 0, 1);
                        const entryBlend = easeParticleTraversal(clamp(traversalProgress / 0.16, 0, 1));
                        const exitStart = 0.82 + traversalDelay * 0.28;
                        const exitBlend = easeParticleTraversal(clamp((t - exitStart) / (1 - exitStart), 0, 1));
                        const cloudPoint = getHelixCloudPoint(i, cloudSettings, helixSettings, time, transitionEffect === 'double-helix', traversalProgress);
                        pBase = blendParticlePoint(dataArray1[i], cloudPoint, entryBlend);
                        pBase = blendParticlePoint(pBase, dataArray2[i], exitBlend);
                    } else {
                        pBase.origX = lerp(dataArray1[i].origX, dataArray2[i].origX, t);
                        pBase.origY = lerp(dataArray1[i].origY, dataArray2[i].origY, t);
                        pBase.origZ = lerp(dataArray1[i].origZ, dataArray2[i].origZ, t);
                        pBase.theta = lerp(dataArray1[i].theta, dataArray2[i].theta, t);
                        pBase.phiZ  = lerp(dataArray1[i].phiZ, dataArray2[i].phiZ, t);
                    }
                } else {
                    pBase = pointsArray[i];
                }

                const morph = Math.sin(pBase.theta * 4 + time * 2) * Math.cos(pBase.phiZ * 3 - time) * params.morph * (1 - helixOrderAmount);
                const r = 1 + morph;
                let x = pBase.origX * r, y = pBase.origY * r, z = pBase.origZ * r;
                let y1 = y * Math.cos(renderRotX) - z * Math.sin(renderRotX), z1 = y * Math.sin(renderRotX) + z * Math.cos(renderRotX); y = y1; z = z1;
                let x1 = x * Math.cos(renderRotY) - z * Math.sin(renderRotY), z2 = x * Math.sin(renderRotY) + z * Math.cos(renderRotY); x = x1; z = z2;
                const scale = (3 / (3 + z)) * moveZScale;
                let px = PARTICLE_ANCHOR_X + (x * scale * sphereSize), py = PARTICLE_ANCHOR_Y + (y * scale * sphereSize);
                
                const gradientFactor = (pBase.origY * -1 + 1) / 2;
                ctx.fillStyle = "rgba(" + interpolateColor(rgb1, rgb2, gradientFactor) + ", " + params.figureOpacity + ")";
                ctx.beginPath();
                const drawSize = cloudAmount > 0 ? lerp(currentSize, currentSize * cloudSettings.pointSize, cloudAmount) : currentSize;
                ctx.arc(px, py, Math.max(0.5, scale * drawSize), 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(animate);
        }

        initShape();
        animate();
    
</script>
</body>
