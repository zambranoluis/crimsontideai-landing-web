<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrimsonTide Network</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="crimsontide-network" aria-hidden="true"></canvas>
<script>
(()=>{'use strict';
const DATA={"params":{"primaryColor":"#d7193f","highlightColor":"#ff3659","backgroundColor":"#000000","opacity":0.95,"glow":1.25,"pointSize":1.5,"lineOpacity":0.07,"lineWidth":0.58,"columns":118,"rows":52,"showLines":true,"transparentBackground":true,"waveHeight":2.03,"waveFreqX":12.2,"waveFreqY":14.3,"detail":0.92,"ridge1Height":1.18,"ridge1X":0.47,"ridge1Y":0.49,"ridge1Width":1,"ridge1Depth":1,"ridge2Height":1.08,"ridge2X":0.5,"ridge2Y":0.39,"ridge2Width":2.37,"ridge2Depth":0.41,"upperRelief":0.79,"perspective":0.92,"topSpread":0.35,"verticalScale":1.05,"horizon":0.69,"tilt":0.18,"directionAngle":0,"perspectiveDirection":0.39,"scale":0.68,"meshWidth":1.66,"meshLength":0.32,"offsetX":0.125,"offsetY":0.195,"speed":1.43,"waveDrift":1.06,"shimmer":1.15,"shimmerSpeed":4.75,"pulseCount":1,"pulseSpeed":0.85,"pulseWidth":0.101,"pulseIntensity":1.28,"ambientGlow":0.63,"interactive":true,"parallax":0.56,"mouseForce":0.32,"mouseRadius":0.18,"mouseSmoothing":0.045,"dprCap":1.75,"adaptiveQuality":true},"states":[{"id":"state-reference","name":"Reference","duration":3.6,"easing":"easeInOut","params":{"primaryColor":"#d7193f","highlightColor":"#ff3659","backgroundColor":"#000000","opacity":0.95,"glow":1.25,"pointSize":1.5,"lineOpacity":0.07,"lineWidth":0.58,"columns":118,"rows":52,"showLines":true,"transparentBackground":true,"waveHeight":2.03,"waveFreqX":12.2,"waveFreqY":14.3,"detail":0.92,"ridge1Height":1.18,"ridge1X":0.47,"ridge1Y":0.49,"ridge1Width":1,"ridge1Depth":1,"ridge2Height":1.08,"ridge2X":0.5,"ridge2Y":0.39,"ridge2Width":2.37,"ridge2Depth":0.41,"upperRelief":0.79,"perspective":0.92,"topSpread":0.35,"verticalScale":1.05,"horizon":0.69,"tilt":0.18,"directionAngle":0,"perspectiveDirection":0.39,"scale":0.68,"meshWidth":1.66,"meshLength":0.32,"offsetX":0.125,"offsetY":0.195,"speed":1.43,"waveDrift":1.06,"shimmer":1.15,"shimmerSpeed":4.75,"pulseCount":1,"pulseSpeed":0.85,"pulseWidth":0.101,"pulseIntensity":1.28,"ambientGlow":0.63,"interactive":true,"parallax":0.56,"mouseForce":0.32,"mouseRadius":0.18,"mouseSmoothing":0.045,"dprCap":1.75,"adaptiveQuality":true}}],"autoplay":true,"loop":true};
DATA.params.primaryColor='#EF3340';
DATA.params.highlightColor='#FF4A56';
DATA.states.forEach(state=>{state.params.primaryColor='#EF3340';state.params.highlightColor='#FF4A56'});
const canvas=document.getElementById('crimsontide-network'),ctx=canvas.getContext('2d',{alpha:true,desynchronized:true});
let renderingActive=true;
addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='crimsontide-visibility'){renderingActive=Boolean(event.data.active);lastFrame=performance.now()}});
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t;
const hex=h=>{const n=parseInt(String(h).replace('#',''),16);return{r:n>>16&255,g:n>>8&255,b:n&255}};
const hexOut=c=>'#'+[c.r,c.g,c.b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');
const color=(a,b,t)=>{a=hex(a);b=hex(b);return hexOut({r:lerp(a.r,b.r,t),g:lerp(a.g,b.g,t),b:lerp(a.b,b.b,t)})};
const ease=(type,t)=>type==='easeInOut'?(t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2):type==='easeOut'?1-Math.pow(1-t,3):type==='smooth'?t*t*(3-2*t):t;
const blend=(a,b,t)=>{const o={};for(const k of new Set([...Object.keys(a),...Object.keys(b)])){const x=a[k],y=b[k];o[k]=typeof x==='number'&&typeof y==='number'?lerp(x,y,t):typeof x==='string'&&/^#[0-9a-f]{6}$/i.test(x)&&/^#[0-9a-f]{6}$/i.test(y)?color(x,y,t):(t<.5?x:y)}return o};
let p={...DATA.params},W=1,H=1,dpr=1,lastFrame=performance.now(),animationTime=0,pointer={x:.72,y:.63,sx:0,sy:0,tx:0,ty:0,inside:false};
const qualityLevels=[{columns:118,rows:52,dprCap:1.75},{columns:92,rows:40,dprCap:1.4},{columns:72,rows:32,dprCap:1.15}];
let qualityIndex=0,slowFrames=0,fastFrames=0,lastQualityChange=performance.now();
function applyQuality(index,now){qualityIndex=clamp(index,0,qualityLevels.length-1);Object.assign(p,qualityLevels[qualityIndex]);slowFrames=0;fastFrames=0;lastQualityChange=now;resize()}
function monitorQuality(frameMs,now){if(!p.adaptiveQuality||now-lastQualityChange<5000)return;if(frameMs>21){slowFrames++;fastFrames=Math.max(0,fastFrames-2)}else if(frameMs<18){fastFrames++;slowFrames=Math.max(0,slowFrames-1)}else{slowFrames=Math.max(0,slowFrames-1);fastFrames=Math.max(0,fastFrames-1)}if(slowFrames>=60&&qualityIndex<qualityLevels.length-1)applyQuality(qualityIndex+1,now);else if(fastFrames>=600&&qualityIndex>0)applyQuality(qualityIndex-1,now)}
function resize(){const r=canvas.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height);dpr=Math.min(devicePixelRatio||1,clamp(+p.dprCap||1.5,1,2));canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect();pointer.x=clamp((e.clientX-r.left)/r.width,0,1);pointer.y=clamp((e.clientY-r.top)/r.height,0,1);pointer.tx=(pointer.x-.5)*2;pointer.ty=(pointer.y-.5)*2;pointer.inside=true});canvas.addEventListener('pointerleave',()=>{pointer.tx=pointer.ty=0;pointer.inside=false});resize();
function terrain(nx,z,t){const wt=t*p.waveDrift,broad=Math.sin(nx*p.waveFreqX+wt*.9)*.44+Math.cos(z*p.waveFreqY-wt*.68)*.28,det=(Math.sin((nx+z*.65)*(13.5+p.detail*1.2)+wt*.56)*.16+Math.cos(nx*(19+p.detail*3)-z*8.5+wt*.23)*.1+Math.sin(nx*31+z*17-wt*.18)*.045)*p.detail,x01=nx*.5+.5,w1=Math.max(.01,p.ridge1Width),d1=Math.max(.01,p.ridge1Depth),r1=Math.exp(-(Math.pow(x01-p.ridge1X,2)/(.032*w1*w1)+Math.pow(z-p.ridge1Y,2)/(.07*d1*d1)))*p.ridge1Height,w2=Math.max(.01,p.ridge2Width),d2=Math.max(.01,p.ridge2Depth),r2=Math.exp(-(Math.pow(x01-p.ridge2X,2)/(.026*w2*w2)+Math.pow(z-p.ridge2Y,2)/(.085*d2*d2)))*p.ridge2Height;let m=0;if(p.interactive&&p.mouseForce>0&&pointer.inside){const dx=x01-pointer.x,dz=z-clamp((pointer.y-.24)/.76,0,1),rad=Math.max(.02,p.mouseRadius);m=Math.exp(-(dx*dx+dz*dz)/(rad*rad))*p.mouseForce*(.54+Math.sin(t*1.8+x01*7)*.08)}return(broad+det+r1+r2+m)*p.waveHeight}
function project(c,r,cols,rows,t){const x01=c/(cols-1),z=r/(rows-1),nx=(x01-.5)*2,ter=terrain(nx,z,t),depth=Math.pow(z,1.38),hconv=p.topSpread+(1-p.topSpread)*depth,nearPers=.17+.83*p.perspective,nearSpread=W*(.34+nearPers*.88)*p.scale*p.meshWidth,ps=p.interactive?p.parallax:0,px=pointer.sx*(7+z*18)*ps*depth,py=pointer.sy*(4+z*10)*ps*depth,cx=W*(.5+p.offsetX),cy=H*(p.horizon+p.offsetY),vp=cx+W*p.perspectiveDirection,nearX=cx+nx*nearSpread*.56,x=vp+(nearX-vp)*hconv+px,nearY=cy+H*1.04*p.scale*p.meshLength,base=cy+(nearY-cy)*depth,terrainInfluence=lerp(p.upperRelief,1,depth),lift=ter*(10+z*44)*p.verticalScale*terrainInfluence,tilt=nx*H*p.tilt*(.3+z)*depth,y=base-lift+tilt+py,a=(Number(p.directionAngle)||0)*Math.PI/180,co=Math.cos(a),si=Math.sin(a),rx=x-cx,ry=y-cy;return{x:cx+rx*co-ry*si,y:cy+rx*si+ry*co,x01,z,ter}}
function ribbon(x,z,t){const d=t*.42,b1=.52+Math.sin(d+z*5)*.022,b2=.70+Math.cos(d*.84+z*6)*.018,b3=.86+Math.sin(d*1.12+z*4.2)*.016;return Math.max(Math.exp(-Math.pow(x-b1,2)/.01)*.72,Math.exp(-Math.pow(x-b2,2)/.011),Math.exp(-Math.pow(x-b3,2)/.009)*.9)}
function pulse(z,t){if(p.pulseCount<=0||p.pulseIntensity<=0)return 0;let v=0,n=Math.max(1,Math.round(p.pulseCount));for(let i=0;i<n;i++){let ph=(t*p.pulseSpeed*.16+i/n)%1,d=Math.abs(z-ph);d=Math.min(d,1-d);v=Math.max(v,Math.exp(-(d*d)/Math.max(.00003,p.pulseWidth*p.pulseWidth)))}return v*p.pulseIntensity}
function timeline(sec){if(!DATA.autoplay||!DATA.states||DATA.states.length<2)return;const s=DATA.states,segs=[];for(let i=0;i<s.length-1;i++)segs.push({a:i,b:i+1,d:Math.max(.1,+s[i].duration||3),e:s[i].easing});if(DATA.loop){const i=s.length-1;segs.push({a:i,b:0,d:Math.max(.1,+s[i].duration||3),e:s[i].easing})}const total=segs.reduce((n,x)=>n+x.d,0);if(!total)return;let time=DATA.loop?sec%total:Math.min(sec,total),cur=0,seg=segs[segs.length-1];for(const x of segs){if(time<=cur+x.d){seg=x;break}cur+=x.d}const q=clamp((time-cur)/seg.d,0,1);p={...blend(s[seg.a].params,s[seg.b].params,ease(seg.e,q)),transparentBackground:DATA.params.transparentBackground}}
function paint(batches){for(const batch of batches.values()){ctx.beginPath();for(let i=0;i<batch.points.length;i+=2){const x=batch.points[i],y=batch.points[i+1];ctx.moveTo(x+batch.radius,y);ctx.arc(x,y,batch.radius,0,Math.PI*2)}ctx.fillStyle=batch.fillStyle;ctx.fill()}}
function draw(ms){if(!renderingActive||document.hidden){lastFrame=ms;requestAnimationFrame(draw);return}const raw=Math.max(0,(ms-lastFrame)/1000);monitorQuality(raw*1000,ms);const frameDelta=Math.min(1/28,raw);lastFrame=ms;animationTime+=frameDelta;const sec=animationTime;timeline(sec);const smooth=clamp(p.mouseSmoothing,.01,.3),smoothScale=clamp(frameDelta*60,.25,4),smoothFactor=1-Math.pow(1-smooth,smoothScale);pointer.sx+=(pointer.tx-pointer.sx)*smoothFactor;pointer.sy+=(pointer.ty-pointer.sy)*smoothFactor;ctx.clearRect(0,0,W,H);if(!p.transparentBackground){ctx.fillStyle=p.backgroundColor||'#000000';ctx.fillRect(0,0,W,H)}ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=clamp(p.opacity,0,1);const a=hex(p.primaryColor),b=hex(p.highlightColor),cols=Math.max(8,Math.round(p.columns)),rows=Math.max(8,Math.round(p.rows)),t=sec*p.speed,grid=Array.from({length:rows},()=>new Array(cols)),pulses=new Array(rows),pointBatches=new Map(),glowBatches=new Map();for(let r=0;r<rows;r++){const z=r/(rows-1);pulses[r]=pulse(z,t);for(let c=0;c<cols;c++)grid[r][c]=project(c,r,cols,rows,t)}if(p.showLines&&p.lineOpacity>0){ctx.lineWidth=p.lineWidth;for(let r=0;r<rows;r+=2){ctx.beginPath();for(let c=0;c<cols;c++){const q=grid[r][c];c?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}ctx.strokeStyle='rgba('+a.r+','+a.g+','+a.b+','+(p.lineOpacity*(.35+r/(rows-1)*.85))+')';ctx.stroke()}for(let c=0;c<cols;c+=3){ctx.beginPath();for(let r=0;r<rows;r++){const q=grid[r][c];r?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)}ctx.strokeStyle='rgba('+a.r+','+a.g+','+a.b+','+(p.lineOpacity*.68)+')';ctx.stroke()}}
for(let r=0;r<rows;r++){const depth=r/(rows-1);for(let c=0;c<cols;c++){const q=grid[r][c];if(q.x<-20||q.x>W+20||q.y<-20||q.y>H+20)continue;const rb=ribbon(q.x01,q.z,t),pu=pulses[r],sh=.5+.5*Math.sin(c*.72+r*.55+t*p.shimmerSpeed),sm=1+(sh-.5)*p.shimmer*.7,m=clamp(.14+rb*.62+pu*.24+Math.max(0,q.ter)*.05,0,1),al=clamp((.13+depth*.72+rb*.22+pu*.19)*sm,0,1),rad=Math.max(.25,p.pointSize*(.46+depth*1.12+rb*.36+pu*.18));if(p.glow>.05&&(rb>.34||pu>.34)){const ai=Math.round(al*7),ri=Math.max(1,Math.round(rad*(2.2+p.glow*1.3))),key=ai+':'+ri;let batch=glowBatches.get(key);if(!batch){batch={fillStyle:'rgba('+b.r+','+b.g+','+b.b+','+clamp((ai/7)*.045*p.glow,0,1)+')',radius:ri,points:[]};glowBatches.set(key,batch)}batch.points.push(q.x,q.y)}const mi=Math.round(m*7),ai=Math.round(al*9),ri=Math.max(1,Math.round(rad*2)),key=mi+':'+ai+':'+ri;let batch=pointBatches.get(key);if(!batch){const qm=mi/7;batch={fillStyle:'rgba('+Math.round(lerp(a.r,b.r,qm))+','+Math.round(lerp(a.g,b.g,qm))+','+Math.round(lerp(a.b,b.b,qm))+','+(ai/9)+')',radius:ri/2,points:[]};pointBatches.set(key,batch)}batch.points.push(q.x,q.y)}}paint(glowBatches);paint(pointBatches);
if(p.ambientGlow>.01){const gx=W*(.73+p.offsetX*.25),gy=H*(.78+p.offsetY*.2),R=W*.28,g=ctx.createRadialGradient(gx,gy,0,gx,gy,R);g.addColorStop(0,'rgba('+b.r+','+b.g+','+b.b+','+(.105*p.ambientGlow)+')');g.addColorStop(1,'rgba('+a.r+','+a.g+','+a.b+',0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}ctx.restore();requestAnimationFrame(draw)}
requestAnimationFrame(draw);
window.CrimsonTideNetwork={get params(){return p},setParams:o=>Object.assign(p,o),play:()=>{DATA.autoplay=true;animationTime=0;lastFrame=performance.now()},pause:()=>{DATA.autoplay=false}};
})();
</script>
</body>
</html>
